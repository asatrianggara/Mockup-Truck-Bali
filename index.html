<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mockup Muatan Balik — Akses Terbatas</title>
<style>
:root{box-sizing:border-box;--bg:#f3f5f9;--card:#fff;--ink:#141821;--mut:#5c6675;--line:#e3e7ef;
 --pri:#1D4ED8;--pri-d:#1740ab;--red:#c81e2b;--shadow:0 1px 2px rgba(16,24,40,.05),0 8px 22px rgba(16,24,40,.07)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;
 font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 -webkit-user-select:none;user-select:none}
.gate{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 18px}
.box{max-width:400px;width:100%;text-align:center}
.mk{width:70px;height:70px;border-radius:20px;background:var(--pri);color:#fff;display:grid;place-items:center;
 font-size:24px;font-weight:800;margin:0 auto 16px}
h1{font-size:21px;margin:0 0 6px}
p{color:var(--mut);margin:0 0 20px;font-size:14.5px;line-height:1.55}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);text-align:left}
label{display:block;font-size:13.5px;font-weight:700;margin-bottom:8px}
input{width:100%;min-height:52px;border-radius:12px;border:1.5px solid var(--line);font-size:18px;
 font-family:inherit;padding:12px 14px;letter-spacing:.18em;text-align:center;text-transform:uppercase;
 -webkit-user-select:text;user-select:text}
input:focus{outline:3px solid rgba(29,78,216,.22);border-color:var(--pri)}
button{width:100%;min-height:50px;border:0;border-radius:12px;background:var(--pri);color:#fff;
 font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;margin-top:14px}
button:hover{background:var(--pri-d)}
.err{color:var(--red);font-size:13.5px;font-weight:600;margin-top:12px;text-align:center}
.kec{font-size:12.5px;color:var(--mut);margin-top:18px;text-align:center}
iframe{flex:1;width:100%;border:0;display:block;min-height:0}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="box">
    <div class="mk">MB</div>
    <h1>Mockup Muatan Balik Truk</h1>
    <p>Pratinjau terbatas dari Digital Oasis. Masukkan kode akses yang kami kirimkan.</p>
    <div class="card">
      <label for="k">Kode akses</label>
      <input id="k" maxlength="10" autocomplete="off" placeholder="••••••••">
      <button id="ok">Buka mockup</button>
      <div class="err" id="err" hidden></div>
    </div>
    <p class="kec">Berlaku sampai 29 Oktober 2026.<br>
      Mohon tidak diteruskan ke pihak lain tanpa sepengetahuan kami.</p>
  </div>
</div>
<iframe id="fr" title="Mockup" hidden></iframe>
